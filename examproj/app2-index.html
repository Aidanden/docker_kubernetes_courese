<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App 2 - Kubernetes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ecfeff, #f0fdf4);
            color: #134e4a;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 90%;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: #ccfbf1;
            color: #0f766e;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #64748b;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #0d9488;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">Application 02</div>

        <h1>Welcome Home</h1>

        <p>
            This is App 2 running on Nginx inside Kubernetes.
            This application has its own ConfigMap and Service.
        </p>

        <a href="#" class="button">Explore App</a>

    </div>

</body>
</html>
