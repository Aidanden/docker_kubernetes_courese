apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres18
  namespace: rahmapostgres18

spec:
  replicas: 2

  selector:
    matchLabels:
      app: postgres18

  template:
    metadata:
      labels:
        app: postgres18

    spec:
      containers:
        - name: postgres
          image: postgres:18

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: admin

            - name: POSTGRES_PASSWORD
              value: "1234"

            - name: POSTGRES_DB
              value: examdb

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres18-pvc
